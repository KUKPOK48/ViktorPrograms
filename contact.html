<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ViktorPrograms</title>
    <link rel="icon" type="image/x-icon" href="121.ico">
    <style>
        :root {
            --main-bg-color: #000000;
            --primary-color: #ED1C24;
            --secondary-color: #870000;
            --text-color: #FFFFFF;
            --glow-effect: 0 0 10px rgba(237, 28, 36, 0.8);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background-color: var(--main-bg-color);
            color: var(--text-color);
            overflow-x: hidden;
            position: relative;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(90deg, 
                    var(--main-bg-color) 20%, 
                    transparent 20%, 
                    transparent 80%, 
                    var(--main-bg-color) 80%),
                linear-gradient(90deg, 
                    var(--main-bg-color) 30%, 
                    transparent 30%, 
                    transparent 70%, 
                    var(--main-bg-color) 70%),
                linear-gradient(90deg, 
                    var(--main-bg-color) 40%, 
                    transparent 40%, 
                    transparent 60%, 
                    var(--main-bg-color) 60%);
            z-index: -2;
        }
        .red-stripes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                repeating-linear-gradient(
                    45deg,
                    rgba(237, 28, 36, 0.1),
                    rgba(237, 28, 36, 0.1) 2px,
                    transparent 2px,
                    transparent 5px
                );
            z-index: -1;
            animation: stripeMove 20s linear infinite;
        }

        @keyframes stripeMove {
            0% { background-position: 0 0; }
            100% { background-position: 100px 100px; }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            position: relative;
            z-index: 1;
        }
        
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 0;
            border-bottom: 1px solid var(--primary-color);
            margin-bottom: 2rem;
        }
        
        .logo {
            font-size: 2rem;
            font-weight: bold;
            color: var(--primary-color);
            text-shadow: var(--glow-effect);
            letter-spacing: 2px;
        }

        nav ul {
            display: flex;
            list-style: none;
        }
        
        nav ul li {
            margin-left: 2rem;
            position: relative;
        }
        
        nav ul li a {
            color: var(--text-color);
            text-decoration: none;
            font-weight: bold;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        nav ul li a::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: -100%;
            width: 100%;
            height: 2px;
            background: var(--primary-color);
            transition: all 0.3s ease;
        }
        
        nav ul li a:hover {
            color: var(--primary-color);
            text-shadow: var(--glow-effect);
        }
        
        nav ul li a:hover::before {
            left: 0;
        }

        .hero {
            text-align: center;
            padding: 4rem 0;
            position: relative;
        }
        
        .hero h1 {
            font-size: 4rem;
            margin-bottom: 1rem;
            color: var(--primary-color);
            text-shadow: 0 0 15px rgba(237, 28, 36, 0.7);
            animation: textGlow 2s infinite alternate;
        }
        
        @keyframes textGlow {
            from { text-shadow: 0 0 10px rgba(237, 28, 36, 0.7); }
            to { text-shadow: 0 0 20px rgba(237, 28, 36, 1); }
        }
        
        .hero p {
            font-size: 1.2rem;
            max-width: 800px;
            margin: 0 auto 2rem;
            line-height: 1.6;
        }

        .contact-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(600px, 1fr));
            gap: 3rem;
            margin: 3rem 0;
        }
        
        .contact-info {
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid var(--primary-color);
            border-radius: 8px;
            padding: 2rem;
            position: relative;
        }
        
        .contact-info::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: var(--primary-color);
        }
        
        .contact-info h3 {
            color: var(--primary-color);
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
        }
        
        .contact-details {
            margin-bottom: 2rem;
        }
        
        .contact-details div {
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
        }
        
        .contact-details i {
            color: var(--primary-color);
            margin-right: 1rem;
            font-size: 1.2rem;
            width: 20px;
            text-align: center;
        }
        
        .social-links {
            display: flex;
            gap: 1rem;
        }
        
        .social-links a {
            color: var(--text-color);
            font-size: 1.5rem;
            transition: all 0.3s ease;
        }
        
        .social-links a:hover {
            color: var(--primary-color);
            transform: translateY(-3px);
        }
        
        .contact-form {
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid var(--primary-color);
            border-radius: 8px;
            padding: 2rem;
            position: relative;
        }
        
        .contact-form::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: var(--primary-color);
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--primary-color);
        }
        
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 0.8rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--primary-color);
            border-radius: 4px;
            color: var(--text-color);
            transition: all 0.3s ease;
        }
        
        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--secondary-color);
            box-shadow: 0 0 10px rgba(237, 28, 36, 0.5);
        }
        
        .form-group textarea {
            min-height: 150px;
            resize: vertical;
        }
        
        .submit-btn {
            display: inline-block;
            padding: 0.8rem 2rem;
            background: linear-gradient(45deg, var(--primary-color), var(--secondary-color));
            color: white;
            text-decoration: none;
            font-weight: bold;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(237, 28, 36, 0.5);
        }
        
        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 20px rgba(237, 28, 36, 0.8);
        }

        .map-container {
            margin-top: 3rem;
            height: 400px;
            border: 1px solid var(--primary-color);
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }
        
        .map-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        footer {
            text-align: center;
            padding: 2rem 0;
            margin-top: 4rem;
            border-top: 1px solid var(--primary-color);
        }

        .cursor {
            position: fixed;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: rgba(237, 28, 36, 0.5);
            pointer-events: none;
            transform: translate(-50%, -50%);
            mix-blend-mode: screen;
            z-index: 9999;
            transition: transform 0.1s ease;
        }
        
        .cursor-follower {
            position: fixed;
            width: 40px;
            height: 40px;
            border: 2px solid var(--primary-color);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 9998;
            transition: transform 0.3s ease, width 0.3s ease, height 0.3s ease;
        }

        @media (max-width: 768px) {
            header {
                flex-direction: column;
            }
            
            nav ul {
                margin-top: 1rem;
                flex-wrap: wrap;
                justify-content: center;
            }
            
            nav ul li {
                margin: 0.5rem;
            }
            
            .hero h1 {
                font-size: 2.5rem;
            }
            
            .contact-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="red-stripes"></div>

    <div class="cursor"></div>
    <div class="cursor-follower"></div>
    
    <div class="container">
        <header>
            <div class="logo">ViktorPrograms</div>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="products.html">Products</a></li>
                    <li><a href="contact.html" class="active">Contact</a></li>
                </ul>
            </nav>
        </header>
        
        <main>
            <section class="hero">
                <h1>CONTACT US</h1>
                <p>Have questions? Get in touch with our team for support and inquiries.</p>
            </section>
            
            <div class="contact-container">
                <div class="contact-info">
                    <h3>OUR COMPANY</h3>
                    <div class="contact-details">
                        <div>
                            <i class="fas fa-envelope"></i>
                            <span>kuksaera@gmail.com</span>
                        </div>
                        <div>
                            <i class="fas fa-clock"></i>
                            <span>Monday - Friday: 12:00 AM - 11:00 PM</span>
                        </div>
                    </div>
                    <h3>FOLLOW US</h3>
                    <div class="social-links">
                        <a href="https://x.com/viktor_programs"><i class="fab fa-x"></i></a>
                        <a href="https://www.tiktok.com/@viktorprograms?is_from_webapp=1&sender"><i class="fab fa-tiktok"></i></a>
                        <a href="https://t.me/ViktorprogV"><i class="fab fa-telegram"></i></a>
                    </div>
                </div>
        
        <footer>
            <p>&copy; 2025 ViktorPrograms. All rights reserved.</p>
        </footer>
    </div>
    
    <script>
        const cursor = document.querySelector('.cursor');
        const cursorFollower = document.querySelector('.cursor-follower');
        
        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
            
            setTimeout(() => {
                cursorFollower.style.left = e.clientX + 'px';
                cursorFollower.style.top = e.clientY + 'px';
            }, 100);
        });

        const interactiveElements = document.querySelectorAll('a, button, input, textarea, .submit-btn, .social-links a');
        
        interactiveElements.forEach(el => {
            el.addEventListener('mouseenter', () => {
                cursor.style.transform = 'translate(-50%, -50%) scale(2)';
                cursor.style.backgroundColor = 'rgba(237, 28, 36, 0.8)';
                cursorFollower.style.transform = 'translate(-50%, -50%) scale(0.5)';
                cursorFollower.style.borderColor = 'rgba(237, 28, 36, 0.8)';
            });
            
            el.addEventListener('mouseleave', () => {
                cursor.style.transform = 'translate(-50%, -50%) scale(1)';
                cursor.style.backgroundColor = 'rgba(237, 28, 36, 0.5)';
                cursorFollower.style.transform = 'translate(-50%, -50%) scale(1)';
                cursorFollower.style.borderColor = 'var(--primary-color)';
            });
        });

        document.addEventListener('DOMContentLoaded', () => {
            const hero = document.querySelector('.hero');
            hero.style.opacity = '0';
            hero.style.transform = 'translateY(20px)';
            
            setTimeout(() => {
                hero.style.transition = 'opacity 0.8s ease, transform 0.8s ease';
                hero.style.opacity = '1';
                hero.style.transform = 'translateY(0)';
            }, 300);

            const contactBlocks = document.querySelectorAll('.contact-info, .contact-form');
            contactBlocks.forEach((block, index) => {
                block.style.opacity = '0';
                block.style.transform = 'translateY(30px)';
                
                setTimeout(() => {
                    block.style.transition = `opacity 0.8s ease ${index * 0.2}s, transform 0.8s ease ${index * 0.2}s`;
                    block.style.opacity = '1';
                    block.style.transform = 'translateY(0)';
                }, 500 + index * 100);
            });
        });
    </script>
</body>
</html>
