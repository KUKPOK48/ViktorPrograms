<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background: url('https://raw.githubusercontent.com/KUKPOK48/ViktorPrograms/refs/heads/main/0ba0d609-5c9a-450b-9cd8-14213be2918d.png') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            overflow-x: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .cursor-ring {
            position: fixed;
            width: 15px;
            height: 15px;
            border: 1px solid orange;
            border-radius: 20%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            animation: rotate 2s linear infinite;
        }


        /* Language Switcher */
        .language-switcher {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
            display: flex;
            gap: 10px;
        }
        .language-switcher button {
            padding: 5px 10px;
            background: rgba(0, 0, 0, 0.7);
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            font-size: 1rem;
        }
        .language-switcher button:hover {
            background: rgba(0, 0, 0, 0.9);
        }

        .menu {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 1000;
        }
        .menu-icon {
            font-size: 1.5rem;
            cursor: pointer;
            padding: 10px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 5px;
            color: white;
        }
        .menu-items {
            position: absolute;
            top: 50px;
            left: 10px;
            background: rgba(0, 0, 0, 0.9);
            border-radius: 5px;
            display: none;
            list-style: none;
            padding: 0;
            margin: 0;
            width: 200px;
            z-index: 1001;
        }
        .menu-items li {
            padding: 10px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }
        .menu-items li:last-child {
            border-bottom: none;
        }
        .menu-items a {
            color: white;
            text-decoration: none;
            font-size: 1rem;
        }
        .menu-items a:hover {
            color: cyan;
        }
        #menu-toggle {
            display: none;
        }
        #menu-toggle:checked ~ .menu-items {
            display: block;
        }

        header {
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 1rem 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            position: relative;
            z-index: 2;
            animation: fadeIn 2s ease-out;
        }
        header img {
            width: 100px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
        }
        h1 {
            font-size: 2.5rem;
            margin: 0;
            color: cyan;
            animation: slideIn 1s ease-in-out forwards;
        }

        main {
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            backdrop-filter: blur(10px);
            position: relative;
            z-index: 2;
            animation: fadeIn 2s ease-out;
        }
        .info-section {
            text-align: center;
            padding: 50px 0;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            margin: 20px auto;
            max-width: 600px;
            animation: fadeIn 2s ease-out;
        }
        .info-section p {
            line-height: 1.8;
        }

        button {
            display: inline-block;
            padding: 15px 30px;
            font-size: 1rem;
            color: #fff;
            background: linear-gradient(45deg, cyan, #00BFFF);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            margin-top: 20px;
        }
        button:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }
        button:active {
            transform: scale(0.95);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.4);
        }

        footer {
            text-align: center;
            padding: 10px 0;
            background: rgba(51, 51, 51, 0.8);
            color: white;
            margin-top: 20px;
            position: relative;
            z-index: 2;
            animation: fadeIn 2s ease-out;
        }
        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: translateY(50px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @keyframes slideIn {
            0% {
                transform: translateX(-100%);
            }
            100% {
                transform: translateX(0);
            }
        }

        @keyframes rotate {
            from {
                transform: translate(-50%, -50%) rotate(0deg);
            }
            to {
                transform: translate(-50%, -50%) rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <div class="menu">

        <nav class="menu-items">

            </ul>
        </nav>

    <!-- Language Switcher -->
    <div class="language-switcher">
        <button onclick="changeLanguage('en')">English</button>
        <button onclick="changeLanguage('ru')">Русский</button>
        <button onclick="changeLanguage('et')">Eesti</button>
    </div>

    <div class="cursor-ring"></div>

    <script>
        const cursorRing = document.querySelector('.cursor-ring');

        document.addEventListener('mousemove', (e) => {
            cursorRing.style.left = `${e.clientX}px`;
            cursorRing.style.top = `${e.clientY}px`;
        });

        const translations = {
            en: {
                title: "JOTYS",
                description: "In this game, you need to navigate through a maze inspired by the atmosphere of DOOM. The goal is to complete the maze as quickly as possible, avoiding enemies and traps to set your best record. The game requires fast reactions and good spatial orientation. Enemies will attack you, and you must either avoid them or fight back using available weapons.",
                goal: "How to Submit Your Record: If you want your record to be featured and become the best player, join our Telegram channel. There, you will find all the instructions on how to submit your record.",
                features: [
                    "Simple but captivating maze mechanics.",
                    "Enemies and obstacles in your path.",
                    "Complete the maze as quickly as possible."
                ]
            },
            ru: {
              title: "JOTYS",
                description: "В этой игре вам предстоит пройти через лабиринт, вдохновленный атмосферой DOOM. Цель — как можно быстрее пройти все уровни, избегая врагов и ловушек, чтобы установить свой рекорд. Игра требует быстроты реакции и хорошей ориентации в пространстве. Враги будут нападать на вас, и вам нужно будет их избегать или сражаться с ними, используя доступные средства защиты. ",
                goal: "Как показать рекорд: Если вы хотите, чтобы ваш рекорд был выставлен и вы стали лучшим игроком, заходите в наш Telegram-канал. Там вы найдете все инструкции для отправки рекорда.",
                features: [
                    "Враги и препятствия на пути.",
                    "Простая, но захватывающая механика лабиринта.",
                    "Необходимо пройти лабиринт как можно быстрее."
                ]
            },
            et: {
                title: "JOTYS",
                description: "Selles mängus tuleb teil navigeerida labürindis, mis on inspireeritud DOOM-i atmosfäärist. Eesmärk on läbida labürint võimalikult kiiresti, vältides vaenlasi ja lõkse, et seada oma parim rekord. Mäng nõuab kiiret reaktsiooni ja head ruumilist orientatsiooni. Vaenlased ründavad teid, ja peate neid kas vältima või nendega võitlema, kasutades saadaval olevaid relvi.",
                goal: "Kuidas oma rekordit esitada: Kui soovite, et teie rekord oleks esitatud ja teist saaks parim mängija, liituge meie Telegrami kanaliga. Sealt leiate kõik juhised oma rekordi esitamiseks.    ",
                features: [
                    "Lihtne, kuid kaasahaarav labürindi mehhanika.",
                    "Vaenlased ja takistused teie teel.",
                    "Läbige labürint võimalikult kiiresti."
                ]
            }
        };

        function changeLanguage(lang) {
            const data = translations[lang];
            document.querySelector('.main-content h1').innerHTML = data.title;
            document.querySelector('.main-content p:nth-of-type(1)').innerHTML = data.description;
            document.querySelector('.main-content p:nth-of-type(2)').innerHTML = data.goal;

            const featureList = document.querySelectorAll('.main-content ul li');
            data.features.forEach((feature, index) => {
                featureList[index].textContent = feature;
            });
        }

        window.onload = () => changeLanguage('en');
    </script>

    <header>
        <img src="https://raw.githubusercontent.com/KUKPOK48/ViktorPrograms/refs/heads/main/e4aad658-e959-41d3-a6f1-79aa5aa1e27a-removebg-preview%20(1).png" alt="Game Vault Logo">

</body>
</html>
